name: build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build CLI
        run: |
          bun install
          ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: "0.0.0-dev-$(date +%Y%m%d%H%M)"
          OPENCODE_RELEASE: "dev"
          GH_REPO: ${{ github.repository }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-binaries
          path: packages/opencode/dist

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-binaries
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in */bin/*; do
            chmod +x "$f" 2>/dev/null || true
          done
          tag="dev-$(date +%Y%m%d%H%M)"
          gh release create "$tag" --title "Development Build $tag" --notes "Automated dev build" -d
          for dir in */; do
            name="${dir%/}"
            tar -czf "${name}.tar.gz" -C "$dir" bin
            gh release upload "$tag" "${name}.tar.gz" --clobber
          done
